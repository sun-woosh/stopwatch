<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>염주 스탑워치</title>
<style>
  :root {
    --paper: #f1e9d6;
    --paper-deep: #e6dac0;
    --ink: #3a2a1d;
    --muted: #8a7558;
    --gold: #b88a2e;
    --gold-soft: #d9b45a;
    --cinnabar: #a23b2d;
    --moss: #5b6b3f;
    --line: #cdbd98;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(ellipse at 50% 0%, #faf4e4 0%, var(--paper) 55%, var(--paper-deep) 100%);
    color: var(--ink);
    font-family: "Noto Serif KR", "Batang", "Malgun Gothic", serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 48px;
  }
  .wrap { width: 100%; max-width: 440px; text-align: center; }
  h1 {
    font-size: 15px;
    font-weight: 400;
    letter-spacing: .5em;
    color: var(--muted);
    margin-bottom: 18px;
    padding-left: .5em;
  }

  /* 염주 + 불상 */
  .altar {
    position: relative;
    width: 100%;
    max-width: 380px;
    aspect-ratio: 1;
    margin: 0 auto;
  }
  .altar svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .aura {
    position: absolute;
    left: 15%; top: 15%;
    width: 70%; height: 70%;
    border-radius: 50%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #fbf5e3, #eadfc3);
    box-shadow:
      0 0 0 1px var(--line),
      0 0 0 6px var(--paper),
      0 0 0 7px var(--gold-soft),
      0 10px 30px rgba(90, 60, 20, .18);
  }
  .altar .aura svg.buddha { position: static; width: 100%; height: 100%; display: block; }
  #ring { transform-origin: 200px 200px; transition: transform .55s cubic-bezier(.3, 1.4, .5, 1); }
  #ring.instant { transition: none; }
  .bead { transition: fill .3s; }

  .display {
    font-variant-numeric: tabular-nums;
    font-family: "Noto Serif KR", "Batang", Georgia, serif;
    font-size: clamp(44px, 14vw, 64px);
    font-weight: 300;
    letter-spacing: 1px;
    margin-top: 22px;
  }
  .rounds {
    margin-top: 4px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .2em;
    min-height: 1.4em;
  }

  .dharma {
    margin: 22px auto 0;
    max-width: 340px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    transition: opacity .6s;
  }
  .dharma.fade { opacity: 0; }
  .dharma blockquote {
    font-size: 16px;
    line-height: 1.7;
    word-break: keep-all;
    color: var(--ink);
  }
  .dharma figcaption {
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: .1em;
    color: var(--muted);
  }
  .controls { display: flex; justify-content: center; gap: 20px; margin: 22px 0 26px; }
  button {
    min-width: 110px;
    padding: 12px 0;
    border-radius: 999px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 17px;
    letter-spacing: .3em;
    padding-left: .3em;
    cursor: pointer;
    transition: background .15s, color .15s, transform .08s, opacity .15s;
  }
  button:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  button:active:not(:disabled) { transform: scale(.96); }
  button:disabled { opacity: .35; cursor: default; }
  #startStop { background: var(--moss); border-color: var(--moss); color: #f6f0dc; }
  #startStop:hover { background: #4a5833; color: #f6f0dc; }
  #startStop.running { background: var(--cinnabar); border-color: var(--cinnabar); }
  #startStop.running:hover { background: #8a2f23; }

  .laps { list-style: none; border-top: 1px solid var(--line); text-align: left; }
  .laps li {
    display: flex;
    justify-content: space-between;
    padding: 12px 8px;
    border-bottom: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
    font-size: 16px;
  }
  .laps li.best { color: var(--moss); }
  .laps li.worst { color: var(--cinnabar); }
  .hint { margin-top: 22px; color: var(--muted); font-size: 12px; letter-spacing: .08em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>念 珠 時 計</h1>

  <div class="altar">
    <svg viewBox="0 0 400 400" aria-hidden="true">
      <defs>
        <radialGradient id="woodGrad" cx="35%" cy="30%" r="75%">
          <stop offset="0" stop-color="#b9885a"/>

        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">

            <path d="M100 172 L100 140"/><path d="M90 150 Q94 162 100 172"/><path d="M110 150 Q106 162 100 172"/>
            <path d="M80 142 Q86 156 100 172"/><path d="M120 142 Q114 156 100 172"/>
          </g>

          <!-- 상체 (피부) -->
          <path d="M68 94 C63 108 65 124 72 138 L128 138 C135 124 137 108 132 94 C128 86 114 84 100 84 C86 84 72 86 68 94Z" fill="url(#skin)"/>

            <path d="M91.5 79 Q100 82.5 108.5 79"/><path d="M91 84 Q100 88 109 84"/>
          </g>

          <!-- 가사: 왼쪽(관객 기준) -->
          <path d="M93 83 C78 84 62 90 58 104 C54 120 56 134 62 142 L108 140 C104 134 98 118 96 106 C95 98 94 90 93 83Z" fill="url(#robe)"/>

            <path d="M126 96 C136 106 138 122 134 138"/>
          </g>
          <!-- 허리띠 -->
          <path d="M60 128 C84 136 116 136 140 128 L142 142 C116 150 84 150 58 142Z" fill="url(#robeDeep)"/>
          <path d="M70 134 C90 140 110 140 130 134" fill="none" stroke="#e8c878" stroke-opacity=".5" stroke-width=".8"/>

          <!-- 올린 오른팔(관객 기준 오른쪽) -->
          <path d="M138 92 C156 98 166 116 160 136 C154 146 138 144 130 138 C136 124 138 108 134 96Z" fill="url(#robe)"/>
          <path d="M146 100 C152 108 154 122 148 132" fill="none" stroke-opacity=".55" stroke-width=".8"/>
          <path d="M152 124 C160 116 162 106 160 96" fill="none" stroke="#57390e" stroke-width="11.5"/>
          <path d="M152 124 C160 116 162 106 160 96" fill="none" stroke="url(#skin)" stroke-width="10"/>
          <path d="M148 128 C154 134 162 130 162 122" fill="none" stroke="#57390e" stroke-width="1.2"/>
          <!-- 손 -->
          <path d="M153 96 C150 88 151 80 157 78 C165 77 169 86 166 96Z" fill="url(#skin)"/>
          <g fill="none" stroke-linecap="round">
            <path d="M158 80 L158.5 66" stroke="#57390e" stroke-width="4.6"/><path d="M158 80 L158.5 66" stroke="#dcb457" stroke-width="3.2"/>
            <path d="M163 82 L165 70" stroke="#57390e" stroke-width="4.4"/><path d="M163 82 L165 70" stroke="#dcb457" stroke-width="3"/>
            <path d="M166 87 L169 77" stroke="#57390e" stroke-width="4"/><path d="M166 87 L169 77" stroke="#dcb457" stroke-width="2.7"/>
          </g>
          <circle cx="152" cy="84" r="3.6" fill="none" stroke="#57390e" stroke-width="3.6"/>
          <circle cx="152" cy="84" r="3.6" fill="none" stroke="#dcb457" stroke-width="2.2"/>

          <!-- 무릎 위 손 (선정인) -->
          <ellipse cx="97" cy="148" rx="19" ry="7" fill="url(#skin)"/>

          <!-- 얼굴 -->

          <!-- 나발과 육계 -->
          <path d="M84 55 C81 38 88 29 100 29 C112 29 119 38 116 55 C115 49 108 45 100 45 C92 45 85 49 84 55Z" fill="url(#curls)"/>
          <path d="M91 33 C90 22 94 17 100 17 C106 17 110 22 109 33 C106 29 94 29 91 33Z" fill="url(#curls)"/>

          <!-- 이목구비 -->
          <circle cx="100" cy="49.5" r="1.4" fill="#fff4cc" stroke-width=".5"/>

    </div>
  </div>

  <div class="display" id="display">00:00.00</div>
  <div class="rounds" id="rounds">南無阿彌陀佛</div>

  <figure class="dharma" id="dharma">
    <blockquote id="quoteText"></blockquote>
    <figcaption id="quoteSrc"></figcaption>
  </figure>

  <div class="controls">
    <button id="lapReset" disabled>기록</button>
    <button id="startStop">시작</button>
  </div>
  <ul class="laps" id="laps"></ul>
  <p class="hint">Space 시작/정지 · L 기록 · R 초기화</p>
</div>

<script>
  const BEADS = 108;
  const STEP = 360 / BEADS;
  const R = 172, C = 200;

  const display = document.getElementById('display');
  const roundsEl = document.getElementById('rounds');
  const startStopBtn = document.getElementById('startStop');
  const lapResetBtn = document.getElementById('lapReset');
  const lapsEl = document.getElementById('laps');
  const ring = document.getElementById('ring');

  // 염주 알 만들기 (위쪽 12시 방향에서 시계 방향)
  const beadEls = [];
  const NS = 'http://www.w3.org/2000/svg';
  const cord = document.createElementNS(NS, 'circle');
  cord.setAttribute('cx', C); cord.setAttribute('cy', C); cord.setAttribute('r', R);
  cord.setAttribute('fill', 'none'); cord.setAttribute('stroke', '#8a6a3d');
  cord.setAttribute('stroke-width', '1');
  ring.appendChild(cord);
  for (let i = 0; i < BEADS; i++) {
    const a = (i * STEP - 90) * Math.PI / 180;
    const big = i % 27 === 0 && i !== 0;
    const b = document.createElementNS(NS, 'circle');
    b.setAttribute('cx', C + R * Math.cos(a));
    b.setAttribute('cy', C + R * Math.sin(a));
    b.setAttribute('r', big ? 6.2 : 4.4);
    b.setAttribute('fill', 'url(#woodGrad)');
    b.setAttribute('class', 'bead');
    ring.appendChild(b);
    beadEls.push(b);
  }

  // 시간의 유한함을 일깨우는 말씀 (20초마다 바뀜)
  const QUOTES = [
    ['게으르지 않음은 죽지 않는 길이요, 게으름은 죽음의 길이다.', '『법구경』'],
    ['오늘 해야 할 일을 오늘 하라. 내일 죽음이 올지 누가 알겠는가.', '『일야현자경』'],
    ['지나간 것을 쫓지 말고 오지 않은 것을 바라지 말라. 오직 지금 이 순간을 살라.', '『일야현자경』'],
    ['생사의 일이 크고 무상이 빠르니, 시간은 사람을 기다리지 않는다. 삼가 방일하지 말라.', '선가(禪家)의 경책'],
    ['모든 것은 덧없다. 게으름 없이 정진하라.', '부처님의 마지막 유훈'],
  ];
  const quoteBox = document.getElementById('dharma');
  const quoteText = document.getElementById('quoteText');
  const quoteSrc = document.getElementById('quoteSrc');
  let quoteIdx = -1;

  function showQuote(idx, instant) {
    if (idx === quoteIdx) return;
    quoteIdx = idx;
    const apply = () => {
      quoteText.textContent = QUOTES[idx][0];
      quoteSrc.textContent = '— ' + QUOTES[idx][1];
      quoteBox.classList.remove('fade');
    };
    if (instant) return apply();
    quoteBox.classList.add('fade');
    setTimeout(apply, 600);
  }

  let running = false;
  let startTime = 0;
  let elapsed = 0;
  let lapStart = 0;
  let laps = [];
  let rafId = null;
  let shownSec = -1;

  function format(ms) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const s = totalSec % 60;
    const m = Math.floor(totalSec / 60) % 60;
    const h = Math.floor(totalSec / 3600);
    const pad = n => String(n).padStart(2, '0');
    return (h ? h + ':' : '') + pad(m) + ':' + pad(s) + '.' + pad(cs);
  }

  function now() {
    return running ? elapsed + (performance.now() - startTime) : elapsed;
  }

  // 초가 바뀔 때마다 염주를 한 알씩 굴린다
  function setBeads(sec, instant) {
    if (sec === shownSec) return;
    shownSec = sec;
    if (instant) ring.classList.add('instant');
    ring.style.transform = `rotate(${-sec * STEP}deg)`;
    if (instant) { void ring.getBoundingClientRect(); ring.classList.remove('instant'); }

    const active = sec % BEADS;
    beadEls.forEach((b, i) => {
      const isActive = i === active;
      b.setAttribute('fill', isActive || i < active ? 'url(#goldGrad)' : 'url(#woodGrad)');
      b.setAttribute('filter', isActive ? 'url(#glow)' : '');
      b.setAttribute('opacity', i < active ? '.85' : '1');
    });
    showQuote(Math.floor(sec / 20) % QUOTES.length, instant || sec === 0);
    const rounds = Math.floor(sec / BEADS);
    roundsEl.textContent = rounds > 0
      ? `${rounds}회전 · ${active} / ${BEADS}`
      : (sec > 0 ? `${active} / ${BEADS}` : '南無阿彌陀佛');
  }

  function tick() {
    const t = now();
    display.textContent = format(t);
    setBeads(Math.floor(t / 1000), false);
    const current = lapsEl.querySelector('li.current span:last-child');
    if (current) current.textContent = format(t - lapStart);
    rafId = requestAnimationFrame(tick);
  }

  function renderLaps() {
    lapsEl.innerHTML = '';
    if (running || elapsed > 0) {
      const li = document.createElement('li');
      li.className = 'current';
      li.innerHTML = `<span>${laps.length + 1}번째</span><span>${format(now() - lapStart)}</span>`;
      lapsEl.appendChild(li);
    }
    const min = Math.min(...laps), max = Math.max(...laps);
    for (let i = laps.length - 1; i >= 0; i--) {
      const li = document.createElement('li');
      if (laps.length >= 2) {
        if (laps[i] === min) li.className = 'best';
        else if (laps[i] === max) li.className = 'worst';
      }
      li.innerHTML = `<span>${i + 1}번째</span><span>${format(laps[i])}</span>`;
      lapsEl.appendChild(li);
    }
  }

  function updateButtons() {
    startStopBtn.textContent = running ? '정지' : '시작';
    startStopBtn.classList.toggle('running', running);
    lapResetBtn.textContent = running || elapsed === 0 ? '기록' : '초기화';
    lapResetBtn.disabled = !running && elapsed === 0;
  }

  function startStop() {
    if (running) {
      elapsed = now();
      running = false;
      cancelAnimationFrame(rafId);
      display.textContent = format(elapsed);
    } else {
      startTime = performance.now();
      running = true;
      tick();
    }
    updateButtons();
    renderLaps();
  }

  function lap() {
    if (!running) return;
    const t = now();
    laps.push(t - lapStart);
    lapStart = t;
    renderLaps();
  }

  function reset() {
    if (running) return;
    elapsed = 0;
    lapStart = 0;
    laps = [];
    display.textContent = format(0);
    shownSec = -1;
    setBeads(0, true);
    renderLaps();
    updateButtons();
  }

  startStopBtn.addEventListener('click', startStop);
  lapResetBtn.addEventListener('click', () => running ? lap() : reset());
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); startStop(); }
    else if (e.key === 'l' || e.key === 'L') lap();
    else if (e.key === 'r' || e.key === 'R') reset();
  });

  setBeads(0, true);
</script>
</body>
</html>
